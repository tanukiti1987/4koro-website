  title: "手作り/作りたての揚げ物とお弁当のお店 - 4丁目のコロッケ屋さん"
  description: "栃木県小山市間々田で創業1964年のテイクアウト弁当・お惣菜専門店。4丁目のコロッケ屋さんは全て手作り・作りたてにこだわり、コロッケ、メンチカツ、唐揚げ弁当など豊富なメニューをご用意。間々田駅周辺でお弁当・お惣菜をお探しの方はぜひご来店ください。"
