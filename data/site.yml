content:
  hero:
    image: "images/header.jpg"
    alt: "4丁目のコロッケ屋さん/外観"
  about:
    image: "images/cooker-img.png"
    title: "1964年創業\n手作り/作りたてを徹底した、おいしいお惣菜・お弁当を販売しています"
    description: "お客様にご注文をいただいてからお惣菜やお弁当を作っているため、他のお店にはない、できたての美味しさを十分に味わうことができます。\nまた、味だけでなく価格もお手頃になるよう日々工夫をしております。"
  pricing:
    title: "お惣菜・お弁当のご案内"
    description: "すべて手作り/作りたてのお惣菜・お弁当。お昼に、夕食に食べていただきやすいよう、種類も価格も充実させています。"
    note: "その他、パーティーオードブル 2,300円・3,240円\nご要望あれば、まずはご相談ください。"

